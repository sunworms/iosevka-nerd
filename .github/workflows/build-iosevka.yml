name: Patch prebuilt Iosevka (Term)

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch: {}

jobs:
  # 1. Check if upstream has a release we haven't processed yet
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Get latest upstream Iosevka release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(curl -sL --max-time 15 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/be5invis/Iosevka/releases/latest | jq -r .tag_name)
          
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: Failed to fetch upstream tag or API timed out."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether we already published it
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

  # 2. Create the single shared release container first
  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Iosevka Nerd Font Term ${{ needs.check-version.outputs.version }}
          body: |
            Automated Nerd Font patch of prebuilt upstream Iosevka Term release ${{ needs.check-version.outputs.version }}.
            Source: https://github.com/be5invis/Iosevka
            Variant: IosevkaTerm
          draft: false

  # 3. Download, patch, and upload the Term variant artifact
  download-and-patch:
    needs: [check-version, create-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Download and extract upstream PkgTTF archive
        run: |
          TAG="${{ needs.check-version.outputs.version }}"
          CLEAN_VERSION="${TAG#v}"
          URL="https://github.com/be5invis/Iosevka/releases/download/$TAG/PkgTTF-IosevkaTerm-$CLEAN_VERSION.zip"
          
          echo "Downloading $URL..."
          curl -sL "$URL" -o package.zip
          mkdir -p in out
          unpack -q package.zip -d in/ || unzip -q package.zip -d in/

      - name: Patch with Nerd Fonts
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/in":/in \
            -v "${{ github.workspace }}/out":/out \
            -e "PN=2" \
            nerdfonts/patcher \
            --complete --careful --quiet --no-progressbars --mono

      - name: Upload variant artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-font-term
          path: out/

  # 4. Package and release the single zip file
  package-and-release:
    needs: [check-version, create-release, download-and-patch]
    runs-on: ubuntu-24.04
    steps:
      - name: Download variant artifact
        uses: actions/download-artifact@v4
        with:
          name: patched-font-term
          path: combined-fonts

      - name: Create single zip
        run: |
          cd combined-fonts
          zip -r "../IosevkaTermNerdFont-${{ needs.check-version.outputs.version }}.zip" .

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.version }}"
          ZIP_NAME="IosevkaTermNerdFont-$TAG.zip"

          gh release upload "$TAG" "$ZIP_NAME" --repo "${{ github.repository }}" --clobber
