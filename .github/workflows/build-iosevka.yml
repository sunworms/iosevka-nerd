name: Patch prebuilt Iosevka (Term, Aile and Etoile)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  # 1. Check if upstream has a release we haven't processed yet
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Get latest upstream Iosevka release
        id: upstream
        run: |
          TAG=$(curl -sL https://api.github.com/repos/be5invis/Iosevka/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether we already published it
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

  # 2. Create the single shared release container first
  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Iosevka Nerd Font ${{ needs.check-version.outputs.version }}
          body: |
            Automated Nerd Font patch of prebuilt upstream Iosevka release ${{ needs.check-version.outputs.version }}.
            Source: https://github.com/be5invis/Iosevka
            Variants: IosevkaTerm, IosevkaAile, IosevkaEtoile
          draft: false

  # 3. Matrix job downloading, patching, and uploading its specific variant artifact
  download-and-patch:
    needs: [check-version, create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - plan: term
            pkg_name: IosevkaTerm
          - plan: aile
            pkg_name: IosevkaAile
          - plan: etoile
            pkg_name: IosevkaEtoile
    steps:
      - name: Download and extract upstream PkgTTF archive
        run: |
          TAG="${{ needs.check-version.outputs.version }}"
          CLEAN_VERSION="${TAG#v}"
          PKG_NAME="${{ matrix.pkg_name }}"
          URL="https://github.com/be5invis/Iosevka/releases/download/$TAG/PkgTTF-$PKG_NAME-$CLEAN_VERSION.zip"
          
          echo "Downloading $URL..."
          curl -sL "$URL" -o package.zip
          mkdir -p in out
          unzip -q package.zip -d in/

      - name: Patch with Nerd Fonts
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/in":/in \
            -v "${{ github.workspace }}/out":/out \
            -e "PN=2" \
            nerdfonts/patcher \
            --complete --careful --quiet --no-progressbars

      - name: Upload variant artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-font-${{ matrix.plan }}
          path: out/

  # 4. Combine all variants into a single zip and upload to release
  package-and-release:
    needs: [check-version, create-release, download-and-patch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all variant artifacts
        uses: actions/download-artifact@v4
        with:
          path: combined-fonts
          pattern: patched-font-*
          merge-multiple: true

      - name: Create single combined zip
        run: |
          cd combined-fonts
          zip -r "../IosevkaNerdFonts-${{ needs.check-version.outputs.version }}.zip" .

      - name: Upload combined zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.version }}"
          ZIP_NAME="IosevkaNerdFonts-$TAG.zip"

          gh release upload "$TAG" "$ZIP_NAME" --repo "${{ github.repository }}" --clobber
