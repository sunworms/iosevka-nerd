name: Build Custom Iosevka Fonts

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.upstream.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Get latest upstream Iosevka release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(curl -sL --max-time 15 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/be5invis/Iosevka/releases/latest | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: Failed to fetch upstream tag or API timed out."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether we already published it
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # Manual runs are allowed to rebuild/clobber an existing release
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              # Scheduled runs skip if already published
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-patch:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream Iosevka repository
        uses: actions/checkout@v4
        with:
          repository: be5invis/Iosevka
          ref: ${{ needs.check-version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint libpango1.0-dev libpixman-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Create private-build-plans.toml
        run: |
          cat << 'EOF' > private-build-plans.toml
          [buildPlans.aile-lean]
          family = "Iosevka Aile Lean"
          spacing = "quasi-proportional"
          serifs = "sans"
          noCvSs = true
          noLigation = true
          exportGlyphNames = true

          [buildPlans.aile-lean.weights.light]
          shape = 300
          menu = 300
          css = 300
          [buildPlans.aile-lean.weights.regular]
          shape = 400
          menu = 400
          css = 400
          [buildPlans.aile-lean.weights.medium]
          shape = 500
          menu = 500
          css = 500
          [buildPlans.aile-lean.weights.bold]
          shape = 700
          menu = 700
          css = 700
          [buildPlans.aile-lean.weights.extrabold]
          shape = 800
          menu = 800
          css = 800

          [buildPlans.aile-lean.slopes.Upright]
          angle = 0
          shape = "upright"
          menu = "upright"
          css = "normal"
          [buildPlans.aile-lean.slopes.Italic]
          angle = 9.4
          shape = "italic"
          menu = "italic"
          css = "italic"

          [buildPlans.aile-lean.widths.normal]
          shape = 500
          menu = 5
          css = "normal"

          [buildPlans.etoile-lean]
          family = "Iosevka Etoile Lean"
          spacing = "quasi-proportional"
          serifs = "slab"
          noCvSs = true
          noLigation = true
          exportGlyphNames = true

          [buildPlans.etoile-lean.weights.light]
          shape = 300
          menu = 300
          css = 300
          [buildPlans.etoile-lean.weights.regular]
          shape = 400
          menu = 400
          css = 400
          [buildPlans.etoile-lean.weights.medium]
          shape = 500
          menu = 500
          css = 500
          [buildPlans.etoile-lean.weights.bold]
          shape = 700
          menu = 700
          css = 700
          [buildPlans.etoile-lean.weights.extrabold]
          shape = 800
          menu = 800
          css = 800

          [buildPlans.etoile-lean.slopes.Upright]
          angle = 0
          shape = "upright"
          menu = "upright"
          css = "normal"
          [buildPlans.etoile-lean.slopes.Italic]
          angle = 9.4
          shape = "italic"
          menu = "italic"
          css = "italic"

          [buildPlans.etoile-lean.widths.normal]
          shape = 500
          menu = 5
          css = "normal"

          [buildPlans.term-lean]
          family = "Iosevka Term Lean"
          spacing = "term"
          serifs = "sans"
          noCvSs = true
          noLigation = true
          exportGlyphNames = true

          [buildPlans.term-lean.weights.regular]
          shape = 400
          menu = 400
          css = 400
          [buildPlans.term-lean.weights.bold]
          shape = 700
          menu = 700
          css = 700

          [buildPlans.term-lean.slopes.Upright]
          angle = 0
          shape = "upright"
          menu = "upright"
          css = "normal"
          [buildPlans.term-lean.slopes.Italic]
          angle = 9.4
          shape = "italic"
          menu = "italic"
          css = "italic"

          [buildPlans.term-lean.widths.normal]
          shape = 500
          menu = 5
          css = "normal"
          EOF

      - name: Compile Fonts (TTF)
        run: |
          npm run build -- ttf::aile-lean ttf::etoile-lean ttf::term-lean --jCmd=4

      - name: Patch Term Variant with Nerd Fonts
        run: |
          mkdir -p dist/term-patched
          docker run --rm \
            -v "${{ github.workspace }}/dist/term-lean/TTF":/in \
            -v "${{ github.workspace }}/dist/term-patched":/out \
            -e "PN=4" \
            nerdfonts/patcher \
            --complete --careful --quiet --no-progressbars --mono

      - name: Stage all final fonts
        run: |
          mkdir -p dist/final
          cp dist/aile-lean/TTF/*.ttf dist/final/
          cp dist/etoile-lean/TTF/*.ttf dist/final/
          cp dist/term-patched/*.ttf dist/final/

      - name: Package single archive
        run: |
          mkdir -p dist/packages
          cd dist/final
          zip -r "../packages/Iosevka-Custom-${{ needs.check-version.outputs.version }}.zip" .

      - name: Create or clobber release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.version }}"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists — deleting and recreating."
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            "dist/packages/Iosevka-Custom-${TAG}.zip" \
            --repo "${{ github.repository }}" \
            --title "Iosevka Lean Variants ${TAG}" \
            --notes "Custom automated builds of Iosevka Lean variants: Aile Lean, Etoile Lean, and patched Term Lean.
          Base Tag: ${TAG}"
